apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    app: {{ .Release.Name }}
    component: minio
spec:
  host: {{ .Values.minio.host | quote }}
  port:
    targetPort: minio
  to:
    kind: Service
    name: {{ .Release.Name }}-minio
    weight: 100
  wildcardPolicy: None
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect