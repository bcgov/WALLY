{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minio.fullname" . }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.minio.replicaCount  }}
  strategy:
    type: {{ .Values.minio.deploymentStrategy }}
  selector:
    matchLabels:
      {{- include "minio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minio.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "minio.name" . }}
          image: "{{ .Values.global.registry }}/{{ .Values.global.repository }}/minio:{{ .Values.global.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - /minio-entrypoint.sh server /opt/minio/s3/data
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.secretName }}
                  key: minioAccessKey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.secretName }}
                  key: minioSecretKey
            - name: MINIO_DATA_DIR
              value: /opt/minio/s3/data
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 20m
            limits:
              cpu: 250m
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: minio-vol
              mountPath: /opt/minio/s3/data
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: minio-vol
          persistentVolumeClaim:
            claimName: {{ include "minio.fullname" . }}
{{- end }}