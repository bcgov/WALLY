apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
    component: frontend
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  sessionAffinity: None