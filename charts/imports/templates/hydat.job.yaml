apiVersion: batch/v1
kind: Job
metadata:
  name: wally-importer-hydat-{{ .Release.Revision }}-{{ randAlphaNum 5 | lower }}
  labels:
    component: importer
    job: import-hydat
    name: wally-importer-hydat
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  parallelism: 1
  completions: 1
  template:
    metadata:
      name: wally-importer-hydat
    spec:
      containers:
      - name: importer
        image: "{{ .Values.importer.image }}"
        command: ['/dataload/load_hydat.sh']
        resources:
          requests:
            cpu: 200m
            memory: 4Gi
          limits:
            cpu: '1'
            memory: 4Gi
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "backend.PGSuperUser" . }}
              key: user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "backend.PGSuperUser" . }}
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: {{ include "backend.PGApplicationUser" . }}
              key: dbname
        - name: POSTGRES_SERVER
          valueFrom:
            secretKeyRef:
              name: {{ include "backend.PGSuperUser" . }}
              key: host
        - name: PGLOADER_LOG_DIR
          value: /dataload/pgloader
      restartPolicy: Never