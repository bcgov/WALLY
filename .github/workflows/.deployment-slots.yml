name: .Deployment Slots

on:
  workflow_call:
    inputs:
      total_slots:
        description: Total number of available deployment slots
        default: 10
        required: false
        type: number
      slot_prefix:
        description: Hostname prefix used for each slot (e.g. wally-slot)
        default: wally-slot
        required: false
        type: string

    outputs:
      route:
        description: 'The bare route/path for the claimed or reused slot (no domain suffix)'
        value: ${{ jobs.find_deployment_slot.outputs.route }}

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true

jobs:
  find_deployment_slot:
    name: Find or claim slot
    runs-on: ubuntu-24.04
    outputs:
      route: ${{ steps.slot.outputs.commands }}
    steps:
      - name: Find or claim deployment slot
        id: slot
        uses: bcgov/action-oc-runner@v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            NAMESPACE="${{ secrets.oc_namespace }}"
            RELEASE_NAME="wally-${{ github.event.number }}"
            TOTAL_SLOTS="${{ inputs.total_slots }}"
            PREFIX="${{ inputs.slot_prefix }}"

            EXISTING_HOST=$(oc get route -n "$NAMESPACE" \
              -l "app.kubernetes.io/instance=${RELEASE_NAME}" \
              -o jsonpath='{.items[0].spec.host}' 2>/dev/null || true)

            if [ -n "$EXISTING_HOST" ]; then
              SLOT=$(echo "$EXISTING_HOST" | grep -oP "${PREFIX}-\K[0-9]+")
              echo "${PREFIX}-${SLOT}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            USED_SLOTS=$(oc get routes -n "$NAMESPACE" \
              -o jsonpath='{.items[*].spec.host}' | \
              grep -oP "${PREFIX}-\K[0-9]+" | sort -u || true)

            for i in $(seq 1 "$TOTAL_SLOTS"); do
              if ! echo "$USED_SLOTS" | grep -qx "$i"; then
                echo "${PREFIX}-${i}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done

            echo "::error::No free deployment slots available (all $TOTAL_SLOTS in use)"
            exit 1