name: Import Jobs (Staging)

on:
  # push:
    # branches: [WO-2026-030-import-staging]
  workflow_dispatch:
    # Manual trigger only - these jobs hit external APIs (DataBC, GWELLS)
    # and load real data, so they shouldn't fire automatically on every
    # push. Run deliberately when you actually want to (re)seed staging.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  import:
    name: Run Import Jobs
    uses: ./.github/workflows/.import-jobs.yml
    secrets: inherit
    with:
      environment: staging
      directory_application: ./charts/imports
      values_application: values.yaml